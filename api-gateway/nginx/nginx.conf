# ==================================
# NGINX API Gateway Configuration
# ==================================
# Sistema de Monitoreo Minero
# Puerto: 80 (entrada pública)
#
# Este API Gateway centraliza:
# - Routing a microservicios
# - Autenticación JWT
# - Rate Limiting
# - CORS
# - Logging
# - Load Balancing

# Configuración de eventos
events {
    worker_connections 1024;
}

http {
    # Configuración básica
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Optimizaciones
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # ==================================
    # UPSTREAMS - Definición de Microservicios
    # ==================================

    # Backend Legacy (Usuarios, Mina, Turno)
    upstream backend_legacy {
        server backend:4000;
        keepalive 32;
    }

    # Servicio de Monitoreo (Equipos)
    upstream servicio_monitoreo {
        server servicio-monitoreo:5000;
        keepalive 32;
    }

    # Servicio de Operaciones
    upstream servicio_operaciones {
        server servicio-operaciones:6000;
        keepalive 32;
    }

    # Frontend (Archivos estáticos)
    upstream frontend_app {
        server frontend:3000;
        keepalive 32;
    }

    # ==================================
    # RATE LIMITING
    # ==================================
    # Zona para limitar peticiones por IP
    # 10MB de memoria, 10 peticiones por segundo
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Zona para autenticación (más restrictiva)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # ==================================
    # SERVIDOR PRINCIPAL
    # ==================================
    server {
        listen 80;
        server_name localhost;

        # Tamaño máximo de body (para uploads)
        client_max_body_size 10M;

        # ==================================
        # CORS HEADERS (Aplicado a todas las respuestas)
        # ==================================
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Max-Age' 3600 always;

        # Manejar preflight requests (OPTIONS)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ==================================
        # FRONTEND - Archivos Estáticos
        # ==================================
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================
        # VALIDACIÓN JWT - Subrequest para auth_request
        # ==================================
        location = /auth/validate {
            internal;  # Solo accesible desde subrequests internos
            proxy_pass http://backend_legacy/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # ==================================
        # AUTENTICACIÓN - Sin protección JWT
        # ==================================
        location /api/auth {
            # Rate limiting más restrictivo para login
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://backend_legacy/api/auth;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================
        # SERVICIO DE MONITOREO - Equipos
        # ==================================
        # Crear equipo
        location /api/equipos {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Validación JWT centralizada
            auth_request /auth/validate;

            proxy_pass http://servicio_monitoreo/api/equipos;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Monitoreo - Alertas y KPIs
        location /api/monitoreo {
            limit_req zone=api_limit burst=20 nodelay;

            # Validación JWT centralizada
            auth_request /auth/validate;

            proxy_pass http://servicio_monitoreo/api/monitoreo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================
        # SERVICIO DE OPERACIONES
        # ==================================
        location /api/operaciones {
            limit_req zone=api_limit burst=20 nodelay;

            # Validación JWT centralizada
            auth_request /auth/validate;

            proxy_pass http://servicio_operaciones/api/operaciones;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # KPIs de Operaciones
        location /api/kpis {
            limit_req zone=api_limit burst=20 nodelay;

            # Validación JWT centralizada
            auth_request /auth/validate;

            proxy_pass http://servicio_operaciones/api/kpis;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================
        # BACKEND LEGACY - Otros Endpoints
        # ==================================
        # Usuarios
        location /api/usuarios {
            limit_req zone=api_limit burst=20 nodelay;

            # Validación JWT centralizada
            auth_request /auth/validate;

            proxy_pass http://backend_legacy/api/usuarios;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Mina
        location /api/mina {
            limit_req zone=api_limit burst=20 nodelay;

            # Validación JWT centralizada
            auth_request /auth/validate;

            proxy_pass http://backend_legacy/api/mina;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Turnos
        location /api/turnos {
            limit_req zone=api_limit burst=20 nodelay;

            # Validación JWT centralizada
            auth_request /auth/validate;

            proxy_pass http://backend_legacy/api/turnos;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================================
        # HEALTH CHECKS
        # ==================================
        location /health {
            access_log off;
            return 200 "API Gateway is healthy\n";
            add_header Content-Type text/plain;
        }

        # Health check de cada servicio
        location /health/backend {
            proxy_pass http://backend_legacy/health;
        }

        location /health/monitoreo {
            proxy_pass http://servicio_monitoreo/health;
        }

        location /health/operaciones {
            proxy_pass http://servicio_operaciones/health;
        }

        location /health/frontend {
            proxy_pass http://frontend_app/health;
        }

        # ==================================
        # MÉTRICAS Y MONITOREO
        # ==================================
        location /nginx_status {
            stub_status on;
            access_log off;
            # Solo accesible desde red interna
            allow 172.16.0.0/12;
            deny all;
        }

        # ==================================
        # ERROR PAGES
        # ==================================
        error_page 404 /404.html;
        location = /404.html {
            return 404 '{"error": "Endpoint no encontrado"}';
            add_header Content-Type application/json;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 '{"error": "Error interno del servidor"}';
            add_header Content-Type application/json;
        }

        # Rate limit exceeded
        error_page 429 /429.html;
        location = /429.html {
            return 429 '{"error": "Demasiadas peticiones, intenta más tarde"}';
            add_header Content-Type application/json;
        }
    }

    # ==================================
    # TODO: SERVIDOR HTTPS (Producción)
