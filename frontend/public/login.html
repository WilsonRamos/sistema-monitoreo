<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Monitoreo Minero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .users-help {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }

        .users-help strong {
            display: block;
            color: #333;
            margin-bottom: 5px;
        }

        .user-credential {
            padding: 5px 0;
            font-family: 'Courier New', monospace;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="logo">⛏️</div>
            <h1>Sistema de Monitoreo Minero</h1>
            <p class="subtitle">Ingresa tus credenciales</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingresa tu usuario"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn" id="loginBtn">
                Iniciar Sesión
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Autenticando...</p>
            </div>

            <div id="message" class="message"></div>
        </form>

        <div class="users-help">
            <strong>👥 Usuarios de prueba:</strong>
            <div class="user-credential">🔑 admin / Admin123!</div>
            <div class="user-credential">👷 supervisor1 / Super123!</div>
            <div class="user-credential">👨‍🔧 operador1 / Opera123!</div>
        </div>

        <div class="footer">
            <p>© 2026 Sistema de Monitoreo Minero</p>
            <p>UNSA - Ingeniería de Software II</p>
        </div>
    </div>

    <!-- Configuración -->
    <script src="js/config.js"></script>

    <!-- Servicio de Autenticación -->
    <script src="js/auth.service.js"></script>

    <!-- Lógica de Login -->
    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');
        const messageDiv = document.getElementById('message');

        // Manejar submit del formulario
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Validar
            if (!username || !password) {
                mostrarMensaje('Por favor completa todos los campos', 'error');
                return;
            }

            // Deshabilitar formulario
            loginBtn.disabled = true;
            loading.classList.add('show');
            messageDiv.style.display = 'none';

            try {
                console.log('🔐 Intentando login:', username);

                const resultado = await AuthService.login(username, password);

                console.log('✅ Login exitoso:', resultado);

                mostrarMensaje('¡Login exitoso! Redirigiendo...', 'success');

                // Redirigir a la aplicación principal
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);

            } catch (error) {
                console.error('❌ Error en login:', error);
                mostrarMensaje(error.message || 'Error al iniciar sesión', 'error');

                // Rehabilitar formulario
                loginBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        // Función para mostrar mensajes
        function mostrarMensaje(texto, tipo) {
            messageDiv.textContent = texto;
            messageDiv.className = `message ${tipo}`;
            messageDiv.style.display = 'block';
        }

        // Verificar si ya está logueado
        window.addEventListener('DOMContentLoaded', () => {
            if (AuthService.isAuthenticated()) {
                console.log('✅ Usuario ya autenticado, redirigiendo...');
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
