<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Monitoreo Minero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 24px;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1e293b 0%, #475569 100%);
            border-radius: 12px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        h1 {
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: #f9fafb;
        }

        input:focus {
            outline: none;
            border-color: #1e293b;
            background: white;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn:hover {
            background: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            font-weight: 500;
        }

        .message.success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
            display: block;
        }

        .message.error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            border-top: 1px solid #e5e7eb;
        }

        .users-help {
            margin-top: 24px;
            padding: 16px;
            background-color: #f3f4f6;
            border-radius: 8px;
            font-size: 12px;
            color: #6b7280;
            border-left: 3px solid #1e293b;
        }

        .users-help strong {
            display: block;
            color: #374151;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .user-credential {
            padding: 6px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #4b5563;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 12px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 2px solid #e5e7eb;
            border-top: 2px solid #1e293b;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
            margin: 8px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="logo">SM</div>
            <h1>Sistema de Monitoreo Minero</h1>
            <p class="subtitle">Ingrese sus credenciales para continuar</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingresa tu usuario"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn" id="loginBtn">
                Iniciar Sesión
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Autenticando...</p>
            </div>

            <div id="message" class="message"></div>
        </form>

        <div class="users-help">
            <strong>Usuarios de prueba:</strong>
            <div class="user-credential">admin / Admin123!</div>
            <div class="user-credential">supervisor1 / Super123!</div>
            <div class="user-credential">operador1 / Opera123!</div>
        </div>

        <div class="footer">
            <p>© 2026 Sistema de Monitoreo Minero</p>
            <p>Universidad Nacional de San Agustín - Ingeniería de Software</p>
        </div>
    </div>

    <!-- Configuración -->
    <script src="js/config.js"></script>

    <!-- Servicio de Autenticación -->
    <script src="js/auth.service.js"></script>

    <!-- Lógica de Login -->
    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');
        const messageDiv = document.getElementById('message');

        // Manejar submit del formulario
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Validar
            if (!username || !password) {
                mostrarMensaje('Por favor completa todos los campos', 'error');
                return;
            }

            // Deshabilitar formulario
            loginBtn.disabled = true;
            loading.classList.add('show');
            messageDiv.style.display = 'none';

            try {
                console.log('[AUTH] Intentando iniciar sesión:', username);

                const resultado = await AuthService.login(username, password);

                console.log('[AUTH] Inicio de sesión exitoso:', resultado);

                mostrarMensaje('Inicio de sesión exitoso. Redirigiendo...', 'success');

                // Redirigir a la aplicación principal
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);

            } catch (error) {
                console.error('[AUTH] Error en inicio de sesión:', error);
                mostrarMensaje(error.message || 'Error al iniciar sesión', 'error');

                // Rehabilitar formulario
                loginBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        // Función para mostrar mensajes
        function mostrarMensaje(texto, tipo) {
            messageDiv.textContent = texto;
            messageDiv.className = `message ${tipo}`;
            messageDiv.style.display = 'block';
        }

        // Verificar si ya está logueado
        window.addEventListener('DOMContentLoaded', () => {
            if (AuthService.isAuthenticated()) {
                console.log('[AUTH] Usuario ya autenticado, redirigiendo...');
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
